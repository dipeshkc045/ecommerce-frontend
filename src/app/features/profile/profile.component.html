<div class="profile-page">

  <!-- Page Header -->
  <div class="profile-page__header">
    <h1 class="profile-page__title">My Profile</h1>
    <p class="profile-page__subtitle">Manage your personal information, password, and account settings.</p>
  </div>

  <!-- User Overview Card -->
  <div class="profile-card profile-card--overview">
    <div class="profile-overview">
      <div class="profile-overview__avatar-wrap">
        <img
          [src]="user.avatarUrl || 'assets/default-avatar.png'"
          alt="Profile Avatar"
          class="profile-overview__avatar"
        />
        <label for="avatar-upload" class="profile-overview__avatar-btn" title="Change photo">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </label>
        <input id="avatar-upload" type="file" (change)="onAvatarChange($event)" class="profile-overview__avatar-input" accept="image/*" />
      </div>
      <div class="profile-overview__info">
        <h2 class="profile-overview__name">{{ user.firstName }} {{ user.lastName }}</h2>
        <p class="profile-overview__uid">User ID: {{ user.id }}</p>
        <p class="profile-overview__email">{{ user.email }}</p>
      </div>
    </div>
  </div>

  <!-- Profile Edit Form -->
  <form [formGroup]="profileForm" (ngSubmit)="onSaveProfile()" class="profile-form">

    <!-- Section: Personal Information -->
    <div class="profile-card">
      <div class="profile-card__header">
        <h3 class="profile-card__title">Personal Information</h3>
      </div>
      <div class="profile-grid profile-grid--2">
        <div class="profile-field">
          <label class="profile-field__label">First Name</label>
          <input type="text" formControlName="firstName" class="profile-field__input" placeholder="John" />
        </div>
        <div class="profile-field">
          <label class="profile-field__label">Last Name</label>
          <input type="text" formControlName="lastName" class="profile-field__input" placeholder="Doe" />
        </div>
        <div class="profile-field">
          <label class="profile-field__label">Email Address</label>
          <input type="email" formControlName="email" class="profile-field__input" placeholder="john.doe@example.com" />
        </div>
        <div class="profile-field">
          <label class="profile-field__label">Phone Number</label>
          <input type="tel" formControlName="phone" class="profile-field__input" placeholder="+1 (555) 000-0000" />
        </div>
      </div>
    </div>

    <!-- Section: Change Password -->
    <div class="profile-card">
      <div class="profile-card__header">
        <h3 class="profile-card__title">Change Password</h3>
      </div>
      <div class="profile-grid profile-grid--3">
        <div class="profile-field">
          <label class="profile-field__label">Current Password</label>
          <input type="password" formControlName="currentPassword" class="profile-field__input" placeholder="••••••••" />
        </div>
        <div class="profile-field">
          <label class="profile-field__label">New Password</label>
          <input type="password" formControlName="newPassword" class="profile-field__input" placeholder="••••••••" />
        </div>
        <div class="profile-field">
          <label class="profile-field__label">Confirm New Password</label>
          <input type="password" formControlName="confirmPassword" class="profile-field__input" placeholder="••••••••" />
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="profile-actions">
      <button type="button" (click)="onCancel()" class="profile-btn profile-btn--ghost">
        Cancel
      </button>
      <button type="submit" [disabled]="profileForm.invalid || isLoading" class="profile-btn profile-btn--primary">
        @if (isLoading) {
          <span class="profile-btn__spinner"></span>
        }
        Save Changes
      </button>
    </div>

  </form>
</div>
