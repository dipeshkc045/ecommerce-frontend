<div class="max-w-4xl mx-auto p-6 space-y-8">
  <!-- Page Header -->
  <div>
    <h1 class="text-2xl font-bold text-gray-900">My Profile</h1>
    <p class="text-sm text-gray-500">Manage your personal information, password, and account settings.</p>
  </div>

  <!-- User Overview Card -->
  <div class="flex items-center justify-between p-6 bg-white rounded-xl border border-gray-200 shadow-sm">
    <div class="flex items-center space-x-4">
      <div class="relative">
        <img
          [src]="user.avatarUrl || 'assets/default-avatar.png'"
          alt="Profile Avatar"
          class="w-20 h-20 rounded-full object-cover border-2 border-pink-500"
        />
        <label for="avatar-upload" class="absolute bottom-0 right-0 p-1.5 bg-pink-600 text-white rounded-full shadow hover:bg-pink-700 cursor-pointer transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
        </label>
        <input id="avatar-upload" type="file" (change)="onAvatarChange($event)" class="hidden" accept="image/*" />
      </div>
      <div>
        <h2 class="text-lg font-semibold text-gray-800">{{ user.firstName }} {{ user.lastName }}</h2>
        <p class="text-xs text-gray-400 font-mono">User ID: {{ user.id }}</p>
        <p class="text-sm text-gray-500 mt-1">{{ user.email }}</p>
      </div>
    </div>
  </div>

  <!-- Profile Edit Form -->
  <form [formGroup]="profileForm" (ngSubmit)="onSaveProfile()" class="space-y-6">

    <!-- Section: Personal Information -->
    <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm space-y-6">
      <h3 class="text-lg font-semibold text-gray-800 border-b pb-3">Personal Information</h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
          <input
            type="text"
            formControlName="firstName"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition text-sm text-gray-800"
            placeholder="John"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
          <input
            type="text"
            formControlName="lastName"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition text-sm text-gray-800"
            placeholder="Doe"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
          <input
            type="email"
            formControlName="email"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition text-sm text-gray-800"
            placeholder="john.doe@example.com"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
          <input
            type="tel"
            formControlName="phone"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition text-sm text-gray-800"
            placeholder="+1 (555) 000-0000"
          />
        </div>
      </div>
    </div>

    <!-- Section: Change Password -->
    <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm space-y-6">
      <h3 class="text-lg font-semibold text-gray-800 border-b pb-3">Change Password</h3>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Current Password</label>
          <input
            type="password"
            formControlName="currentPassword"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition text-sm text-gray-800"
            placeholder="••••••••"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
          <input
            type="password"
            formControlName="newPassword"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition text-sm text-gray-800"
            placeholder="••••••••"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
          <input
            type="password"
            formControlName="confirmPassword"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition text-sm text-gray-800"
            placeholder="••••••••"
          />
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-end space-x-4 pt-2">
      <button
        type="button"
        (click)="onCancel()"
        class="px-6 py-2.5 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 text-sm font-medium transition"
      >
        Cancel
      </button>

      <button
        type="submit"
        [disabled]="profileForm.invalid || isLoading"
        class="px-6 py-2.5 rounded-lg bg-pink-600 text-white hover:bg-pink-700 focus:ring-4 focus:ring-pink-200 text-sm font-medium transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
      >
        <span *ngIf="isLoading" class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
        Save Changes
      </button>
    </div>
  </form>
</div>
