<section class="section" aria-label="Clips to Cart">
    <div class="clips-inner">
        <div class="section-header">
            <h2 class="section-title">Clips to Cart</h2>
            <a routerLink="/products" class="view-all">
                View All
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12" />
                    <polyline points="12 5 19 12 12 19" />
                </svg>
            </a>
        </div>

        <div class="clips-grid">
            @for (clip of clips; track clip.title) {
            <a class="clip-card" routerLink="/products">
                <div class="clip-thumbnail">
                    <img [src]="clip.thumbnail" [alt]="clip.title" loading="lazy" />
                    <!-- Play button overlay -->
                    <div class="play-overlay">
                        <svg width="40" height="40" viewBox="0 0 48 48" fill="none">
                            <circle cx="24" cy="24" r="22" fill="rgba(0,0,0,0.45)" stroke="rgba(255,255,255,0.6)"
                                stroke-width="2" />
                            <polygon points="19,14 37,24 19,34" fill="white" />
                        </svg>
                    </div>
                </div>
                <p class="clip-title">{{ clip.title }}</p>
            </a>
            }
        </div>
    </div>
</section>
