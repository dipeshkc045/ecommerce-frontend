<header class="site-header" role="banner">
  <div class="header-inner">

    <a routerLink="/" class="logo" [attr.aria-label]="'Emox home' | t">
      <span class="logo-mark">e</span>
      <span class="logo-text">emox</span>
    </a>

    <nav class="header-nav" [attr.aria-label]="'Main' | t">
      <a routerLink="/products" routerLinkActive="active" class="nav-link">{{ 'Products' | t }}</a>
      @if (isLoggedIn()) {
        <a routerLink="/orders" routerLinkActive="active" class="nav-link">{{ 'My orders' | t }}</a>
      }
    </nav>

    <div class="header-actions">

      <button
        class="action-icon-btn theme-btn"
        type="button"
        [attr.aria-label]="'Current theme: {theme}. Click to change theme.' | t: { theme: (themeLabel() | t) }"
        [title]="'Theme: {theme}' | t: { theme: (themeLabel() | t) }"
        (click)="toggleTheme()"
      >
        @if (isDark()) {
          <svg lucideSun width="20" height="20"></svg>
        } @else {
          <svg lucideMoon width="20" height="20"></svg>
        }
      </button>

      <button
        class="action-icon-btn lang-btn"
        type="button"
        [attr.lang]="i18n.lang() === 'en' ? 'ne' : 'en'"
        [attr.aria-label]="(i18n.lang() === 'en' ? 'Change language to Nepali' : 'Change language to English') | t"
        [title]="(i18n.lang() === 'en' ? 'Change language to Nepali' : 'Change language to English') | t"
        (click)="i18n.toggle()"
      >
        {{ i18n.lang() === 'en' ? 'नेपाली' : 'English' }}
      </button>

      <a routerLink="/cart" class="action-icon-btn cart-btn" [attr.aria-label]="'Shopping cart' | t">
        <svg lucideShoppingCart width="20" height="20"></svg>
        @if (cartCount() > 0) {
          <span class="cart-badge">{{ cartCount() | num }}</span>
        }
      </a>

      @if (!isLoggedIn()) {
        <a routerLink="/login" class="sign-in-btn">{{ 'Sign In' | t }}</a>
      } @else {
        <button class="sign-in-btn" type="button" [attr.aria-label]="'Sign out' | t" (click)="logout()">
          <svg lucideLogOut width="15" height="15"></svg>
          <span class="btn-label">{{ 'Sign Out' | t }}</span>
        </button>
      }
    </div>
  </div>
</header>
